# ==============================================================================
# Sistema CRUD Assistência - stack local de desenvolvimento
#
#   1) copy .env.example .env   (edite ADMIN_EMAIL / ADMIN_PASSWORD)
#   2) docker compose up --build
#   3) http://localhost:8080
#
# Este compose é para DESENVOLVIMENTO/LOCAL. Produção real deve usar
# ASPNETCORE_ENVIRONMENT=Production, HTTPS na frente da aplicação e
# migrations aplicadas manualmente (veja o README).
# ==============================================================================
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistencia
      POSTGRES_USER: postgres
      # LOCAL/DEV: fallback apenas para uso local — defina POSTGRES_PASSWORD no .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistencia-dev-local}
    volumes:
      - assistencia-postgres:/var/lib/postgresql/data
    # Somente a própria máquina (não expor o banco na rede)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistencia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Montada a partir de POSTGRES_PASSWORD para manter uma única fonte de senha
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=assistencia;Username=postgres;Password=${POSTGRES_PASSWORD:-assistencia-dev-local};SSL Mode=Disable"
      # Obrigatórios: sem cadastro público, o seed usa estes valores para o 1º usuário
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env — copie .env.example para .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env — senha precisa de min. 8, maiúscula, minúscula e dígito}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  assistencia-postgres:
